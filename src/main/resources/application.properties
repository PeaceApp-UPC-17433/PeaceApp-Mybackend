spring.application.name=peaceapp

# Spring DataSource Configuration
spring.datasource.url = ${DB_URL}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Spring Data JPA Configuration
spring.jpa.show-sql=true

#Spring Data JPA Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration properties
authorization.jwt.secret=8Zz5tw0Ionm3XPZZfN0NOml3z9FMfmpgXwovR9fp6ryDIoGRM8EPHAB6iHsc0fb
authorization.jwt.expiration.days=30

# Password reset
authorization.password-reset.expiration-minutes=30

# Community: confirmaciones netas que verifican un reporte automáticamente
community.verification.confirmation-threshold=3

# Administrador inicial (opcional): se crea al arrancar si no existe. Usar variables de entorno, no valores fijos.
peaceapp.admin.email=${ADMIN_EMAIL:}
peaceapp.admin.password=${ADMIN_PASSWORD:}
